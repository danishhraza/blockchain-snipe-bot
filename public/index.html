<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Wallet Buy Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>Wallet Buy Tracker</h1>
          <p class="subtitle">Real-time feed token buys on Base &amp; Solana.</p>
        </div>
        <div class="status" id="connectionStatus">Connecting…</div>
      </header>

      <section class="feed">
        <h2>Live Buy Feed</h2>
        <div class="feed-table">
          <div class="feed-row feed-header">
            <span>Trader</span>
            <span>Side</span>
            <span>Chain</span>
            <span>Token</span>
            <span>Contract / Mint</span>
            <span>Amount</span>
            <span>Value (USDT)</span>
            <span>Price (USDT)</span>
            <span>Time (UTC)</span>
            <span>DEX</span>
            <span>Copy</span>
          </div>
          <div id="feedRows" class="feed-body"></div>
        </div>
      </section>

    </div>

    <script src="app.js"></script>
  </body>
</html>
